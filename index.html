<!doctype html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>건강 카드뉴스 대시보드</title>
<style>
  :root {
    --bg-top: #fdf9f5;
    --bg-bottom: #f6ede6;
    --ink: #2b231f;
    --ink-soft: #8b7c6e;
    --accent: #c84a62;
    --accent-deep: #a3344a;
    --accent-soft: #fadee3;
    --gold: #b27a26;
    --gold-soft: #f1e3c6;
    --panel: #fffdfa;
    --rule: #e9ddd0;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", -apple-system, sans-serif;
    background: linear-gradient(180deg, var(--bg-top), var(--bg-bottom));
    color: var(--ink);
    min-height: 100vh;
  }
  header {
    padding: 28px 24px;
    text-align: center;
    border-bottom: 1px solid var(--rule);
  }
  header h1 { margin: 0 0 6px; font-size: 22px; }
  header p { margin: 0; color: var(--ink-soft); font-size: 14px; }

  .btn {
    border: none;
    border-radius: 999px;
    padding: 8px 16px;
    font-size: 13px;
    cursor: pointer;
    font-weight: 600;
  }
  .btn-ghost { background: var(--accent-soft); color: var(--accent-deep); }

  .missing-link-row {
    background: var(--panel); border: 1px solid var(--rule); border-radius: 12px;
    padding: 10px 14px; display: flex; flex-direction: column; gap: 6px;
  }
  .missing-link-row b { font-size: 13px; }
  .missing-link-field { display: flex; align-items: center; gap: 8px; }
  .missing-link-field label { margin: 0; width: 74px; flex: 0 0 auto; font-size: 12px; }
  .missing-link-input {
    flex: 1; font-family: inherit; font-size: 13px; padding: 6px 10px;
    border-radius: 8px; border: 1px solid var(--rule); background: #fff; color: var(--ink);
  }
  .missing-link-saved { font-size: 11px; color: var(--gold); }
  .missing-link-input.invalid { border-color: var(--accent); background: #fff5f6; }
  .missing-link-error { font-size: 11px; color: var(--accent); }
  .missing-link-search-row { display: flex; align-items: center; gap: 8px; }
  .missing-link-search-row a {
    font-size: 12px; font-weight: 700; color: var(--accent-deep); text-decoration: none;
    background: var(--accent-soft); padding: 5px 10px; border-radius: 8px;
  }
  .missing-link-copy-btn {
    font-family: inherit; font-size: 12px; font-weight: 700; padding: 5px 10px;
    border-radius: 8px; border: 1px solid var(--rule); background: #fff; color: var(--ink-soft);
    cursor: pointer;
  }

  /* WHY position:fixed 위젯인지(2026-08-09, "매 화면에서 아래로 끌지않아도
     볼수잇게"): 원래 목록 하단 <details>였는데, topicsList가 길어지면 계속
     스크롤해서 내려가야 보였다 — lib/dashboard.py의 개별 topic 대시보드가
     이미 쓰는 .quick-dock(우측 고정 패널) 패턴을 그대로 가져와서, 스크롤
     위치와 무관하게 항상 접근 가능하게 한다. */
  #missingLinksDock { position: fixed; top: 20px; right: 20px; z-index: 9998; }
  #missingLinksToggle {
    display: flex; align-items: center; gap: 6px;
    background: var(--accent); color: #fff; border: none; border-radius: 999px;
    padding: 10px 18px; font-size: 13px; font-weight: 700; cursor: pointer;
    box-shadow: 0 10px 24px rgba(60,45,35,0.25);
  }
  #missingLinksToggle .count-badge {
    background: rgba(255,255,255,0.25); border-radius: 999px; padding: 1px 8px; font-size: 12px;
  }
  #missingLinksPanel {
    display: none; position: absolute; top: calc(100% + 8px); right: 0;
    width: 320px; max-height: 70vh; overflow-y: auto;
    background: var(--panel); border: 1px solid var(--rule); border-radius: 16px;
    box-shadow: 0 10px 30px rgba(60,45,35,0.25); padding: 14px;
    flex-direction: column; gap: 8px;
  }
  #missingLinksPanel.open { display: flex; }

  /* WHY 여기 새로 추가하는지(2026-08-14, 카드뉴스 허브 탭): :root 변수는
     이미 위에 있어 그대로 재사용, 탭 버튼·카드뉴스 그리드 전용 클래스만
     추가한다. */
  .main-tab-btn {
    border: 1px solid var(--rule); border-radius: 999px; padding: 8px 16px;
    font-size: 13px; font-weight: 700; font-family: inherit; cursor: pointer;
    background: var(--panel); color: var(--ink-soft);
  }
  .main-tab-btn.active { background: var(--accent); color: #fff; border-color: var(--accent); }
  /* WHY !important: topicsSection/missingLinksDock의 display는 기존
     600여 줄 스크립트가 데이터 로딩 시점에 계속 인라인 style로 바꾼다 —
     탭 전환 로직이 인라인 style을 직접 건드리면 그 스크립트가 나중에
     덮어써서 탭이 꺼져있어도 다시 나타나는 경합이 생긴다. 클래스+!important
     로 항상 이기게 한다. */
  .cnh-tab-hidden { display: none !important; }

  /* WHY display:none을 여기서 빼는지(2026-08-14 버그 수정, "카드뉴스
     허브탭에 아무것도안보임"): 이 레이아웃 규칙이 #cardNewsHubSection에
     display:none을 무조건 걸어놓고 있어서, 탭 전환 JS가 .cnh-tab-hidden
     클래스를 지워도(visible 의도) 이 ID 규칙이 그대로 남아 계속 안 보였다
     — 탭 전환은 .cnh-tab-hidden(!important) 클래스 하나로만 제어해야
     하는데 레이아웃 규칙에 display까지 같이 박아놓은 게 원인. 처음
     페이지 로드 시 안 보여야 하는 건 HTML의 class="cnh-tab-hidden" 초기값이
     이미 담당하므로 이 규칙엔 display를 넣지 않아도 된다. */
  #cardNewsHubSection { max-width: 1000px; margin: 20px auto 0; padding: 0 24px 60px; }
  #cardNewsHubStatus { text-align: center; color: var(--ink-soft); padding: 30px 0; font-size: 14px; }
  #cardNewsHubStatus.error { color: var(--accent-deep); }
  .cnh-group-title { font-size: 17px; font-weight: 800; margin: 22px 0 4px; display: flex; align-items: center; gap: 8px; }
  .cnh-group-count { font-size: 12px; font-weight: 600; color: var(--ink-soft); }
  .cnh-vertical-block { margin: 14px 0; }
  .cnh-vertical-badge {
    display: inline-flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 700;
    padding: 4px 10px; border-radius: 999px; background: var(--gold-soft); color: var(--gold);
    margin-bottom: 10px;
  }
  .cnh-vertical-empty { font-size: 13px; color: var(--ink-soft); padding: 4px 2px 0; }
  .cnh-card-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 12px; }
  .cnh-card {
    background: var(--panel); border: 1px solid var(--rule); border-radius: 14px;
    padding: 14px; display: flex; flex-direction: column; gap: 8px;
  }
  .cnh-card-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 8px; }
  .cnh-card-title { font-size: 14px; font-weight: 700; line-height: 1.4; margin: 0; }
  .cnh-done-check {
    display: flex; align-items: center; gap: 4px; font-size: 12px; font-weight: 700;
    color: var(--ink-soft); cursor: pointer; user-select: none; flex-shrink: 0;
  }
  .cnh-done-check input { width: 15px; height: 15px; accent-color: var(--accent); cursor: pointer; }
  .cnh-card.is-done { opacity: 0.55; border-color: var(--gold); background: var(--gold-soft); }
  .cnh-card.is-done .cnh-done-check { color: var(--gold); }
  /* WHY 썸네일을 120px 안팎으로 키우는지(2026-08-14, "발행만 하면 손쉽게
     될 사이즈로"): 원본 카드뉴스 그리드(120px)와 같은 크기 — 너무 작으면
     어떤 사진인지 확인이 안 돼서 결국 원본을 또 열어봐야 하고, 그러면
     "번호별로 바로 확인" 이라는 요청 취지가 무색해진다. */
  .cnh-image-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(108px, 1fr)); gap: 8px; }
  .cnh-image-item { display: flex; flex-direction: column; align-items: center; gap: 3px; }
  .cnh-image-item a { display: block; width: 100%; }
  .cnh-image-item img {
    width: 100%; aspect-ratio: 3/4; object-fit: cover; border-radius: 8px;
    border: 1px solid var(--rule); display: block; background: var(--rule);
  }
  .cnh-image-marker { font-size: 10px; color: var(--ink-soft); text-align: center; line-height: 1.3; }
  .cnh-card-no-images { font-size: 12px; color: var(--ink-soft); margin: 0; }
  .cnh-card-caption-preview {
    font-size: 12px; color: var(--ink-soft); line-height: 1.5;
    max-height: 4.5em; overflow: hidden; white-space: pre-wrap; margin: 0;
  }
  .cnh-card-actions { display: flex; gap: 8px; margin-top: auto; }
  .cnh-card-actions button, .cnh-card-actions a {
    flex: 1; text-align: center; border: none; border-radius: 999px;
    padding: 8px 10px; font-size: 12px; font-weight: 700; cursor: pointer;
    text-decoration: none; font-family: inherit;
  }
  .cnh-btn-copy { background: var(--accent); color: #fff; }
  .cnh-btn-copy.copied { background: var(--gold); }
  .cnh-btn-open { background: var(--accent-soft); color: var(--accent-deep); }
  .cnh-btn-open.disabled { background: var(--rule); color: var(--ink-soft); pointer-events: none; }
  .jp-topic-row {
    display: block; padding: 14px 16px; border: 1px solid var(--rule); border-radius: 12px;
    background: var(--panel); color: var(--ink); text-decoration: none; font-size: 14px; font-weight: 700;
  }
  .jp-topic-row:hover { border-color: var(--accent); }
</style>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="supabase_client.js"></script>
</head>
<body>

<!-- WHY(2026-08-08, "제품 링크 안 되어있는 목록을 메인에다가 따로 빼놓고
     거기다 넣고 저장하면 글로벌로 반영되게" → 2026-08-09, "매 화면에서
     아래로 끌지않아도 볼수잇게"): 개별 topic 대시보드를 하나씩 돌면서 어느
     상품에 링크가 비어있는지 찾는 건 비효율적이다 — 전체 상품 목록
     (output/all_products.json, dashboard.py가 매번 갱신) 대비
     global_product_links(Supabase)에 없는 것만 걸러서 여기서 바로 입력하면,
     그 상품을 쓰는 모든 topic 캡션에 자동 반영된다. 스크롤과 무관하게 항상
     보이도록 body 최상단에 고정 위젯으로 둔다(topicsSection 안이 아님). -->
<div id="missingLinksDock" style="display:none;">
  <button type="button" id="missingLinksToggle">🔗 미등록 링크 <span class="count-badge" id="missingLinksCount">0</span></button>
  <div id="missingLinksPanel">
    <div id="missingLinksList" style="display:flex;flex-direction:column;gap:8px;"></div>
  </div>
</div>

<header>
  <h1>건강 카드뉴스 대시보드</h1>
  <p>완성된 topic 목록 확인, 포스팅 상태 관리, 상품 링크 등록.</p>
</header>

<!-- WHY 탭 부활(2026-08-14, "index를 나눠달라는게 아니라 dashboard 안에
     예전에 있던 구조 그대로하라는건데... 거기 원래 카드뉴스랑 숏츠 카테고리
     분리되어있었잖아"): 2026-08-09에 "숏츠/카드뉴스를 하나의 목록으로
     합친다"고 없앴던 바로 그 탭 구조(아래 topicsSection 안 주석 참고)를
     되살린다 — 다만 이번엔 카드뉴스 탭 쪽이 health 자신의 topics.json이
     아니라 lib/card_news_hub.py가 형제 버티컬 레포들을 모아 만든
     output/card_news_hub.json을 보여준다. 그룹핑 기준(네이버 계정)은
     lib/card_news_hub.py의 VERTICAL_REPOS/GROUP_ORDER가 정본 — 처음엔
     건강+뷰티/육아+홈리빙+반려동물 2개 계정이었다가 "건강 / 육아+반려동물 /
     경제" 3개 계정으로 바뀌었다(뷰티·홈리빙은 지금 계정이 없어 제외, 그
     스크립트 상단 주석 참고). index.html 쪽은 어떤 그룹 이름이 오든 JSON을
     그대로 렌더링할 뿐이라 그룹 구성이 또 바뀌어도 여기는 안 고쳐도 된다.
     새 페이지로 안 옮기고 이 안에서 탭 전환만 한다. -->
<div id="mainTabs" style="max-width:900px;margin:20px auto 0;padding:0 24px;display:flex;gap:8px;flex-wrap:wrap;">
  <button type="button" class="main-tab-btn active" data-tab="health">🩺 건강</button>
  <button type="button" class="main-tab-btn" data-tab="family">👶 육아·반려동물</button>
  <button type="button" class="main-tab-btn" data-tab="finance">💰 경제</button>
  <button type="button" class="main-tab-btn" data-tab="jp_review">🇯🇵 일본상품리뷰</button>
</div>

<!-- WHY(2026-07-31): 매번 output/<topic>/dashboard.html 전체 경로를 외워서 들어가야
     했다는 피드백 — output/topics.json(dashboard.py가 생성할 때마다 자동 갱신)을
     읽어서 완성된 콘텐츠 목록을 루트에서 바로 보여준다.
     WHY 탭 제거(2026-08-09, "카드뉴스 탭이랑 숏츠 탭 나눌 필요 없겠다")로
     한때 이 목록 안에서 숏츠/카드뉴스를 합쳤었지만, 위 mainTabs로 다시
     최상위에서 분리됐다 — 이 섹션 자체는 그 통합 로직 그대로 유지(health
     자신의 숏츠+카드뉴스 topic이 다 여기 나옴), 순수 "카드뉴스만 여러
     버티컬"을 보고 싶을 때만 위 탭으로 전환. -->
<div id="topicsSection" style="max-width:900px;margin:20px auto 0;padding:0 24px;display:none;">
  <input type="text" id="topicSearch" placeholder="폴더명으로 검색 (예: 수면음식)" aria-label="완성된 콘텐츠 폴더명 검색"
    style="width:100%;box-sizing:border-box;padding:10px 14px;margin-bottom:14px;border:1px solid var(--rule);border-radius:10px;font-family:inherit;font-size:14px;color:var(--ink);background:var(--panel);">

  <!-- WHY 탭 제거(2026-08-09, "카드뉴스 탭이랑 숏츠 탭 나눌 필요 없겠다...
       걍 한데 모으고 탭 선택 필요없도록하자" — 채널·언어 축소로 목록 자체가
       작아져서 트랙별로 나눠 볼 실익이 없어짐): 숏츠/카드뉴스를 하나의
       목록으로 합친다. 카드뉴스만 있는 topic은 대시보드에 들어가면 자연히
       카드뉴스 화면만 뜨고(숏츠 콘텐츠 자체가 없으므로), 트랙이 둘 다 있는
       topic은 그 페이지 안의 자체 탭(lib/dashboard.py의 topicTrackTabButtons)
       으로 고르면 된다 — 목록 단계에서 미리 트랙을 고를 필요가 없어짐. -->
  <div id="topicsList" style="display:flex;flex-direction:column;gap:8px;"></div>
  <div id="topicsEmpty" style="display:none;color:var(--ink-soft);font-size:13px;padding:10px 4px;">일치하는 폴더가 없어요</div>

  <details id="topicsDoneWrap" style="margin-top:16px;display:none;">
    <summary style="cursor:pointer;font-size:13px;color:var(--ink-soft);font-weight:700;">완료된 콘텐츠 (<span id="topicsDoneCount">0</span>)</summary>
    <div id="topicsDoneList" style="display:flex;flex-direction:column;gap:8px;margin-top:8px;"></div>
  </details>

  <!-- WHY(2026-08-02): 각 topic 대시보드의 "완료" 체크는 브라우저 localStorage에만
       남아서 Claude Code(파일시스템)는 전혀 볼 수 없고, 기기·브라우저 바뀌면 동기화도
       안 된다 — CSV로 내보내서 프로젝트 폴더(output/posting_log.csv)에 저장해두면
       git으로 추적되는 진짜 기록이 되고, 나중에 SNS API 연동되면 그쪽에서 이 파일을
       직접 갱신 → 가져오기로 브라우저 체크 상태에 다시 반영하는 왕복도 가능해진다. -->
  <div style="margin-top:16px;display:flex;gap:8px;flex-wrap:wrap;">
    <button type="button" id="exportLogBtn" class="btn btn-ghost" style="width:auto;">📥 포스팅 기록 CSV 내보내기</button>
    <label class="btn btn-ghost" style="width:auto;cursor:pointer;">
      📤 CSV 가져오기
      <input type="file" id="importLogInput" accept=".csv" style="display:none;">
    </label>
    <span id="logSyncMsg" style="font-size:12px;color:var(--ink-soft);align-self:center;"></span>
  </div>
  <!-- WHY(2026-08-08, "목록에서 완료된 콘텐츠 목록으로 강제로 옮겨버릴 수 있도록
       하자 내가 직접"): 행 왼쪽 ✅/⬜ 배지를 직접 클릭해 로컬에서 완료 처리할 수
       있게 한다(2026-08-02에 폐기했던 localStorage 방식을 다시 채택 — 이번엔
       완료 여부의 유일한 기준은 여전히 completed_topics.json이고, 이 로컬 체크는
       "일단 눈앞에서 치워두는" 임시 표시일 뿐이다). 기기가 바뀌면 사라지는 문제는
       그대로 남아 있으므로, 아래 내보내기로 CSV를 뽑아 Claude Code에게 전달하면
       실제 항목이 맞는지(6개 언어+영상 완료 여부) 검증한 뒤 completed_topics.json에
       반영한다 — 포스팅 기록 CSV 왕복과 동일한 패턴. -->
  <div style="margin-top:8px;display:flex;gap:8px;flex-wrap:wrap;">
    <button type="button" id="exportManualDoneBtn" class="btn btn-ghost" style="width:auto;">📥 수동 완료 목록 CSV 내보내기</button>
    <span id="manualDoneSyncMsg" style="font-size:12px;color:var(--ink-soft);align-self:center;"></span>
  </div>
  <!-- WHY 상품 링크도 같은 이유로 내보내기가 필요한지(2026-08-07, "쿠팡이랑
       네이버커넥트 넣어놓은 링크도 받게 되어있나? 그거 받아서 너가 처리해야하는데"):
       개별 topic 대시보드의 쿠팡/네이버 링크 입력창(.product-link-input)은
       hs_link_ localStorage에만 저장되고 지금까지 내보내는 방법이 없었다 —
       위 포스팅 기록과 완전히 같은 문제라 같은 CSV 왕복 패턴을 그대로 적용. -->
  <div style="margin-top:8px;display:flex;gap:8px;flex-wrap:wrap;">
    <button type="button" id="exportLinksBtn" class="btn btn-ghost" style="width:auto;">📥 상품 링크 CSV 내보내기</button>
    <span id="linksSyncMsg" style="font-size:12px;color:var(--ink-soft);align-self:center;"></span>
  </div>
</div>

<!-- WHY output/card_news_hub.json을 fetch하는지: 각 버티컬(cerulem-content
     등)이 완전히 독립된 형제 레포라 브라우저가 그 데이터를 직접 못 읽는다 —
     lib/card_news_hub.py가 미리 5개 레포를 스캔해서 health-shorts 안에 이
     파일 하나로 합쳐둔다(위 topicsSection이 읽는 output/all_products.json과
     동일한 사전 집계 패턴). -->
<div id="familyHubSection" class="cnh-tab-hidden">
  <div id="familyHubStatus">불러오는 중…</div>
  <div id="familyHubGroups"></div>
</div>

<div id="financeHubSection" class="cnh-tab-hidden">
  <div id="financeHubStatus">불러오는 중…</div>
  <div id="financeHubGroups"></div>
</div>

<!-- WHY jp_review는 카드뉴스 허브(육아·경제와 같은 방식)가 아니라 topic
     목록 링크 방식인지(2026-08-14, "카드뉴스허브자체가 내가 원하던
     바랑 다르게 들어갔네... jp review 쪽은 카드뉴스 탭 말고 탭을 하나
     더 만들어서"): jp-review-shorts는 health-shorts처럼 topic마다 이미
     완전한 자체 dashboard.html(플랫폼 카드+완료 체크+영상 미리보기)이
     있어서, 그 콘텐츠를 여기 다시 그려 넣지 않고 topic 이름만 나열해서
     각자의 dashboard.html로 보내는 게 맞다 — "숏츠·전체 목록"(건강) 탭이
     health 자신의 topic을 그렇게 보여주는 것과 동일한 패턴. -->
<div id="jpReviewSection" class="cnh-tab-hidden">
  <div id="jpReviewStatus">불러오는 중…</div>
  <div id="jpReviewList" style="display:flex;flex-direction:column;gap:8px;"></div>
</div>

<script>
// WHY 별도 함수/즉시실행 없이 하단 메인 스크립트와 나란히 두는지: 아래
// 600여 줄짜리 기존 스크립트(완료 체크·포스팅로그·상품링크)는 전혀 안
// 건드리고, 탭 전환 + 카드뉴스 허브 렌더링만 독립적으로 추가한다.
(function () {
  // WHY 4탭 구조로 재편(2026-08-14, "카드뉴스허브자체가 내가 원하던 바랑
  // 다르게 들어갔네... 부문별로 탭을 나눠서 하는게 나을듯"): 건강/육아+
  // 반려동물/경제/일본상품리뷰 네이버 계정 부문마다 독립 탭으로 분리 —
  // "건강"은 health 자신의 기존 topic 목록(구 숏츠 탭)을 이름만 바꿔
  // 그대로 쓰고, 육아·경제는 card_news_hub.json을 부문별로 필터링해서
  // 보여주고(+완료 체크박스 신규 추가), 일본상품리뷰는 카드뉴스식 집계가
  // 아니라 topic 목록→각자 dashboard.html 링크 방식(아래 jpReviewSection
  // 주석 참고).
  const TAB_KEYS = ["health", "family", "finance", "jp_review"];
  const tabButtons = {};
  document.querySelectorAll(".main-tab-btn").forEach(btn => { tabButtons[btn.dataset.tab] = btn; });
  const sectionsByTab = {
    health: [document.getElementById("missingLinksDock"), document.getElementById("topicsSection")],
    family: [document.getElementById("familyHubSection")],
    finance: [document.getElementById("financeHubSection")],
    jp_review: [document.getElementById("jpReviewSection")],
  };
  const loadedByTab = { family: false, finance: false, jp_review: false };

  function showTab(which) {
    for (const key of TAB_KEYS) {
      const isActive = key === which;
      tabButtons[key].classList.toggle("active", isActive);
      // WHY classList(.cnh-tab-hidden)만 쓰고 style.display는 직접 안 건드리는지:
      // topicsSection/missingLinksDock의 인라인 style은 기존 스크립트가 계속
      // 갱신한다 — !important 클래스로 숨기면 그 스크립트가 나중에 style을
      // 바꿔도 탭이 꺼져있는 동안은 계속 안 보인다(경합 없음).
      for (const el of sectionsByTab[key]) el.classList.toggle("cnh-tab-hidden", !isActive);
    }
    if (which !== "health" && !loadedByTab[which]) {
      loadedByTab[which] = true;
      if (which === "family" || which === "finance") loadGroupHub(which);
      else if (which === "jp_review") loadJpReview();
    }
  }

  for (const key of TAB_KEYS) tabButtons[key].addEventListener("click", () => showTab(key));

  function cnhEscapeHtml(s) {
    const div = document.createElement("div");
    div.textContent = s;
    return div.innerHTML;
  }

  function cnhBuildCard(item) {
    const card = document.createElement("div");
    card.className = "cnh-card";

    const head = document.createElement("div");
    head.className = "cnh-card-head";

    const title = document.createElement("p");
    title.className = "cnh-card-title";
    title.textContent = item.title;
    head.appendChild(title);

    // WHY 완료 체크박스 추가(2026-08-14, "그냥 사진 다올려놓고 완료된게
    // 뭔지 올려야되는게 뭔지도 파악하기 힘들게 되어있네") — 기존 topic
    // dashboard.html(CARD_TEMPLATE)의 done-toggle과 완전히 같은 방식
    // (hs_done_<topic>_<key> localStorage + Supabase posting_log 테이블)을
    // 재사용해서, 여기서 체크한 것도 같은 posting_log에 쌓여 CSV
    // 내보내기·다른 대시보드와 일관되게 집계된다. 네이버 블로그 캡션
    // 하나만 다루는 카드라 플랫폼은 "네이버 블로그" 고정.
    const doneLabel = document.createElement("label");
    doneLabel.className = "cnh-done-check";
    const doneCb = document.createElement("input");
    doneCb.type = "checkbox";
    const doneSpan = document.createElement("span");
    doneSpan.textContent = "완료";
    doneLabel.appendChild(doneCb);
    doneLabel.appendChild(doneSpan);
    head.appendChild(doneLabel);
    card.appendChild(head);

    const storageKey = `hs_done_${item.topic}_naver_blog`;
    if (localStorage.getItem(storageKey)) {
      doneCb.checked = true;
      card.classList.add("is-done");
    }
    (async () => {
      try {
        const { data } = await sb.from("posting_log").select("platform")
          .eq("topic", item.topic).eq("platform", "네이버 블로그");
        if (data && data.length) {
          doneCb.checked = true;
          card.classList.add("is-done");
        }
      } catch (err) { /* Supabase 조회 실패해도 localStorage 값으로 계속 동작 */ }
    })();
    doneCb.addEventListener("change", () => {
      if (doneCb.checked) {
        const postedAt = new Date().toISOString();
        localStorage.setItem(storageKey, JSON.stringify({ topic: item.topic, platform: "네이버 블로그", postedAt }));
        card.classList.add("is-done");
        hsWrite("/api/posting-log", "POST", { topic: item.topic, platform: "네이버 블로그", posted_at: postedAt });
      } else {
        localStorage.removeItem(storageKey);
        card.classList.remove("is-done");
        hsWrite("/api/posting-log", "DELETE", { topic: item.topic, platform: "네이버 블로그" });
      }
    });

    // WHY 이미지 그리드를 캡션 미리보기보다 먼저 두는지(2026-08-14, "각
    // 블로그에서 어떤 번호에 어떤 사진 넣어놓고 발행만 하면 손쉽게 될
    // 사이즈로"): 발행 작업 순서 자체가 "몇 번 사진을 어디에 넣을지 먼저
    // 확인 → 캡션 복사"라 시각 자료를 텍스트보다 위에 둔다. 원본 클릭 시
    // 새 탭으로 열려서(로컬 jpg든 Pexels URL이든 동일) 그대로 저장하거나
    // 네이버 에디터에 드래그해 넣을 수 있다.
    if (item.images && item.images.length) {
      const imgGrid = document.createElement("div");
      imgGrid.className = "cnh-image-grid";
      for (const img of item.images) {
        const cell = document.createElement("div");
        cell.className = "cnh-image-item";

        const link = document.createElement("a");
        link.href = img.url;
        link.target = "_blank";
        link.rel = "noopener";

        const thumb = document.createElement("img");
        thumb.src = img.url;
        thumb.alt = `${item.title} - ${img.marker}`;
        thumb.loading = "lazy";
        link.appendChild(thumb);
        cell.appendChild(link);

        const marker = document.createElement("span");
        marker.className = "cnh-image-marker";
        marker.textContent = img.marker;
        cell.appendChild(marker);

        imgGrid.appendChild(cell);
      }
      card.appendChild(imgGrid);
    } else {
      const noImages = document.createElement("p");
      noImages.className = "cnh-card-no-images";
      noImages.textContent = "이미지 준비 안 됨";
      card.appendChild(noImages);
    }

    const preview = document.createElement("p");
    preview.className = "cnh-card-caption-preview";
    preview.textContent = item.caption;
    card.appendChild(preview);

    const actions = document.createElement("div");
    actions.className = "cnh-card-actions";

    const copyBtn = document.createElement("button");
    copyBtn.className = "cnh-btn-copy";
    copyBtn.type = "button";
    copyBtn.textContent = "복사";
    copyBtn.setAttribute("aria-label", `${item.title} 캡션 복사`);
    copyBtn.addEventListener("click", async () => {
      try {
        await navigator.clipboard.writeText(item.caption);
        copyBtn.textContent = "복사됨";
        copyBtn.classList.add("copied");
        setTimeout(() => { copyBtn.textContent = "복사"; copyBtn.classList.remove("copied"); }, 1500);
      } catch (err) {
        copyBtn.textContent = "복사 실패";
      }
    });
    actions.appendChild(copyBtn);

    const openLink = document.createElement("a");
    if (item.dashboard_path) {
      openLink.className = "cnh-btn-open";
      openLink.href = item.dashboard_path;
      openLink.target = "_blank";
      openLink.rel = "noopener";
      openLink.textContent = "열기";
    } else {
      openLink.className = "cnh-btn-open disabled";
      openLink.textContent = "대시보드 없음";
    }
    actions.appendChild(openLink);

    card.appendChild(actions);
    return card;
  }

  const GROUP_NAME_BY_TAB = { family: "육아+반려동물", finance: "경제" };
  let hubCache = null;
  async function fetchHub() {
    if (hubCache) return hubCache;
    const res = await fetch("output/card_news_hub.json");
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    hubCache = await res.json();
    return hubCache;
  }

  async function loadGroupHub(tabKey) {
    const statusEl = document.getElementById(tabKey === "family" ? "familyHubStatus" : "financeHubStatus");
    const groupsEl = document.getElementById(tabKey === "family" ? "familyHubGroups" : "financeHubGroups");
    let hub;
    try {
      hub = await fetchHub();
    } catch (err) {
      statusEl.textContent = "output/card_news_hub.json을 못 불러왔습니다 — 먼저 터미널에서 python3 -m lib.card_news_hub 를 실행하세요.";
      statusEl.classList.add("error");
      return;
    }
    const group = hub.groups.find(g => g.group_name === GROUP_NAME_BY_TAB[tabKey]);
    const totalItems = group ? group.verticals.reduce((s, v) => s + v.items.length, 0) : 0;
    if (totalItems === 0) {
      statusEl.textContent = "아직 콘텐츠가 없습니다.";
      return;
    }
    statusEl.remove();
    for (const vertical of group.verticals) {
      const block = document.createElement("div");
      block.className = "cnh-vertical-block";
      if (vertical.items.length === 0) {
        block.innerHTML = `<span class="cnh-vertical-badge">${cnhEscapeHtml(vertical.label)}</span><div class="cnh-vertical-empty">아직 콘텐츠 없음</div>`;
        groupsEl.appendChild(block);
        continue;
      }
      const grid = document.createElement("div");
      grid.className = "cnh-card-grid";
      for (const item of vertical.items) grid.appendChild(cnhBuildCard(item));
      block.innerHTML = `<span class="cnh-vertical-badge">${cnhEscapeHtml(vertical.label)} (${vertical.items.length})</span>`;
      block.appendChild(grid);
      groupsEl.appendChild(block);
    }
  }

  // WHY 별도 fetch 경로인지: jp-review-shorts는 카드뉴스 렌더링이 아니라
  // topic마다 완전한 자체 dashboard.html이 있는 쪽이라(위 jpReviewSection
  // 주석 참고), lib/jp_review_hub.py(jp-review-shorts 쪽 신규 스크립트)가
  // 만드는 output/topics_hub.json(topic·title·dashboard_path만 담음)을
  // 그대로 목록으로 뿌린다 — card_news_hub.json과는 별개 파일.
  async function loadJpReview() {
    const statusEl = document.getElementById("jpReviewStatus");
    const listEl = document.getElementById("jpReviewList");
    let data;
    try {
      const res = await fetch("../verticals/jp-review-shorts/output/topics_hub.json");
      if (!res.ok) throw new Error(`HTTP ${res.status}`);
      data = await res.json();
    } catch (err) {
      statusEl.textContent = "일본상품리뷰 topic 목록을 못 불러왔습니다 — jp-review-shorts에서 python3 -m lib.jp_review_hub 를 먼저 실행하세요.";
      statusEl.classList.add("error");
      return;
    }
    if (!data.topics || data.topics.length === 0) {
      statusEl.textContent = "아직 topic이 없습니다.";
      return;
    }
    statusEl.remove();
    for (const t of data.topics) {
      const row = document.createElement("a");
      row.href = "../verticals/jp-review-shorts/" + t.dashboard_path;
      row.target = "_blank";
      row.rel = "noopener";
      row.className = "jp-topic-row";
      row.textContent = t.title || t.topic;
      listEl.appendChild(row);
    }
  }

  showTab("health");
})();
</script>

<script>
// WHY completed_topics.json으로 전환(2026-08-02, "완성된 콘텐츠 목록 로컬스토리지로
// 하니까 좀 어렵다 걍 끝날때마다 내가 너한테 알려주고 json 업데이트 하는 형태로"):
// 기존 TOPIC_DONE_PREFIX(localStorage) 체크박스는 브라우저에만 남아서 Claude
// Code가 못 읽고 기기 바뀌면 사라졌다 — 이제 output/completed_topics.json(topic
// 폴더명 배열, git 추적)이 완료 여부의 유일한 기준이다. 사용자가 채팅으로 완료를
// 알려주면 Claude Code가 이 파일을 직접 갱신한다. 브라우저에서는 더 이상 체크
// 상태를 바꿀 수 없음(정적 파일이라 쓸 방법이 없어서) — 배지로만 표시.

// WHY(2026-08-02): 각 topic 대시보드의 "완료" 체크는 브라우저 localStorage에만
// 저장돼서 Claude Code(파일시스템 기반)는 전혀 읽을 수 없고 기기·브라우저가
// 바뀌면 동기화도 안 된다("브라우저에 기록되는걸 너가 알수가있어?" 지적) — CSV로
// 내보내서 git으로 추적되는 output/posting_log.csv에 저장해두면 실제 기록이
// 되고, 나중에 SNS API 연동되면 그 파일을 직접 갱신 → 여기서 다시 가져오기로
// 브라우저 체크 상태에 반영하는 왕복도 가능해진다.
const DONE_KEY_PREFIX = "hs_done_";

function _collectPostingLog() {
  const rows = [];
  for (let i = 0; i < localStorage.length; i++) {
    const key = localStorage.key(i);
    if (!key || !key.startsWith(DONE_KEY_PREFIX)) continue;
    try {
      const record = JSON.parse(localStorage.getItem(key));
      if (record && record.topic && record.platform && record.postedAt) rows.push(record);
    } catch (e) {
      // WHY 무시: 이 코드 이전에 "1"로만 저장된 옛날 체크 항목은 topic/platform
      // 정보가 없어서 CSV로 못 내보낸다 — 다시 체크 해제 후 체크하면 새 형식으로 바뀜.
    }
  }
  rows.sort((a, b) => a.postedAt.localeCompare(b.postedAt));
  return rows;
}

function _csvEscape(s) {
  return '"' + String(s).replace(/"/g, '""') + '"';
}

document.getElementById("exportLogBtn").addEventListener("click", () => {
  const rows = _collectPostingLog();
  const lines = ["topic,platform,postedAt", ...rows.map(r =>
    [r.topic, r.platform, r.postedAt].map(_csvEscape).join(","))];
  const blob = new Blob(["﻿" + lines.join("\n")], { type: "text/csv;charset=utf-8;" });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = "posting_log.csv";
  document.body.appendChild(a);
  a.click();
  a.remove();
  URL.revokeObjectURL(a.href);
  document.getElementById("logSyncMsg").textContent =
    `${rows.length}건 내보냄 — 다운로드된 파일을 output/posting_log.csv로 옮겨주세요`;
});

// WHY(2026-08-08): 완료 배지를 눌러 표시한 topic 목록(hs_manual_done_topics)을
// 내보낸다 — completed_topics.json에 반영하기 전 Claude Code가 검증할 수 있게
// 폴더명만 담은 CSV 한 줄짜리 목록.
document.getElementById("exportManualDoneBtn").addEventListener("click", () => {
  const set = _loadManualDone();
  const topicsList = [...set].sort();
  const lines = ["topic", ...topicsList.map(t => _csvEscape(t))];
  const blob = new Blob(["﻿" + lines.join("\n")], { type: "text/csv;charset=utf-8;" });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = "manual_done_topics.csv";
  document.body.appendChild(a);
  a.click();
  a.remove();
  URL.revokeObjectURL(a.href);
  document.getElementById("manualDoneSyncMsg").textContent =
    `${topicsList.length}건 내보냄 — 다운로드된 파일을 Claude Code에게 전달하면 completed_topics.json에 검증 후 반영합니다`;
});

// WHY market_product 순서로 찾는지: localStorage 키가
// "hs_link_<topic>_<market>_<product>" 형태인데, topic·product 이름 자체에도
// "_"가 흔히 들어가서(예: "가슴쓰림_1") 단순 split("_")로는 market/product
// 경계를 못 찾는다 — market은 "coupang"/"naver" 둘뿐이라는 걸 이용해 그
// 마지막 등장 위치를 기준으로 뒤쪽은 product, 그 앞은 topic으로 자른다.
function _collectProductLinks() {
  const rows = [];
  for (let i = 0; i < localStorage.length; i++) {
    const key = localStorage.key(i);
    if (!key || !key.startsWith("hs_link_")) continue;
    const url = localStorage.getItem(key);
    if (!url || !url.trim()) continue;
    for (const market of ["coupang", "naver"]) {
      const marker = "_" + market + "_";
      const idx = key.lastIndexOf(marker);
      if (idx === -1) continue;
      const product = key.slice(idx + marker.length);
      rows.push({ market, product, url: url.trim() });
      break;
    }
  }
  rows.sort((a, b) => a.market.localeCompare(b.market) || a.product.localeCompare(b.product));
  return rows;
}

document.getElementById("exportLinksBtn").addEventListener("click", () => {
  const rows = _collectProductLinks();
  const lines = ["market,product,url", ...rows.map(r =>
    [r.market, r.product, r.url].map(_csvEscape).join(","))];
  const blob = new Blob(["﻿" + lines.join("\n")], { type: "text/csv;charset=utf-8;" });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = "product_links_export.csv";
  document.body.appendChild(a);
  a.click();
  a.remove();
  URL.revokeObjectURL(a.href);
  document.getElementById("linksSyncMsg").textContent = rows.length
    ? `${rows.length}건 내보냄 — 이 파일을 Claude Code에게 전달하면 output/product_links.json·naver_product_links.json에 반영해줍니다`
    : "내보낼 상품 링크가 없어요(대시보드에서 입력한 게 없음)";
});

// WHY 정규식 기반 간단 파서(2026-08-02): 내보내기가 항상 모든 필드를 따옴표로
// 감싸고 값 안에 줄바꿈이 없는 형태로만 만들기 때문에, 범용 CSV 파서 없이도
// 이 정도면 충분하다.
function _parseCsvLine(line) {
  const out = [];
  const re = /"((?:[^"]|"")*)"\s*,?/g;
  let m;
  while ((m = re.exec(line)) !== null) out.push(m[1].replace(/""/g, '"'));
  return out;
}

document.getElementById("importLogInput").addEventListener("change", (e) => {
  const file = e.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = () => {
    const lines = reader.result.replace(/^﻿/, "").split(/\r?\n/).filter(l => l.trim());
    let count = 0;
    for (const line of lines.slice(1)) {
      const [topic, platform, postedAt] = _parseCsvLine(line);
      if (!topic || !platform || !postedAt) continue;
      // WHY encodeURIComponent로 키 재구성: dashboard.py 쪽 체크박스가
      // Python의 quote(topic)/quote(platform명)으로 키를 만들어서, 가져오기도
      // 똑같은 인코딩으로 키를 맞춰야 해당 topic 대시보드가 체크 상태를 인식한다.
      const key = DONE_KEY_PREFIX + encodeURIComponent(topic) + "_" + encodeURIComponent(platform);
      localStorage.setItem(key, JSON.stringify({ topic, platform, postedAt }));
      count++;
    }
    document.getElementById("logSyncMsg").textContent =
      `${count}건 가져옴 — 각 topic 대시보드를 새로고침하면 체크 표시에 반영돼요`;
    e.target.value = "";
  };
  reader.readAsText(file, "utf-8");
});

// 눌러 즉시 완료 처리하고 싶은데 completed_topics.json은 Claude Code가 채팅으로
// 전달받아 갱신하는 git 파일이라 즉시 반영이 안 됐다 — CSV 왕복 대신 Supabase

// 이유로 이 파일 아래, 그리고 lib/dashboard.py가 생성하는 topic별 대시보드에서도
// 전부 Supabase로 전환했다.
const sb = window.supabase.createClient(window.HS_SUPABASE_URL, window.HS_SUPABASE_ANON_KEY);

// WHY 쓰기는 sb.from()이 아니라 이 헬퍼(서버 API 경유)를 쓰는지(2026-08-14):
// Supabase 프로젝트를 다른 프로젝트(vernhaven-blog 계열)와 공유하게 되면서
// 그쪽 퍼블릭 사이트 브라우저 번들에도 같은 anon key가 노출된다 — anon에
// "전체 허용" RLS를 계속 걸어두면 아무나 이 관리 테이블을 쓰고 지울 수
// 있는 구멍이 생긴다. 그래서 실제 쓰기는 service_role 키를 쓰는 /api/*
// 서버 함수로 옮겼다 — 인증은 이 fetch가 아니라 middleware.js의
// matcher("/(.*)")가 /api/*까지 포함해서 이미 Basic Auth로 막는다.
async function hsWrite(path, method, body) {
  const res = await fetch(path, {
    method,
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify(body),
  });
  if (!res.ok) throw new Error(`${path} ${method} 실패: ${await res.text()}`);
}

    // 추가하는데?? 한 세트로 하고 업로드 여부는 앞에 버튼을 따로따로 두는 형태로

    // 거라는 걸 아니까" 그 안에서의 세부 순서는 상관없다고 확인함.
    const groups = new Map();
    const topicUpdatedAt = new Map();
    topics.forEach(t => {

    function renderAll() {
    const topicsList = document.getElementById("topicsList");

      // 언어만 대표로 보여줘야 행이 안 복잡해지는데, 사용자가 한국어 화자라

        img.alt = "";
        img.loading = "lazy";
        img.style.cssText = "width:100%;height:100%;object-fit:cover;display:block;";
        thumb.appendChild(img);
      }

      const textWrap = document.createElement("div");
      textWrap.style.cssText = "flex:1;min-width:0;";

      // WHY <a>가 아니라 <span>인지(2026-08-03, "행 클릭할 때 들어가는 건
      // 없애고"): 행 전체(제목 텍스트)를 눌러서 이동하던 걸 없애고, 아래
      // 버튼으로만 이동하게 한다 — 어느 언어로 갈지 행 텍스트 클릭만으로는
      // 애매했던 것도 같이 해결됨.
      const titleSpan = document.createElement("span");
      titleSpan.textContent = baseTopic;
      titleSpan.style.cssText = "display:block;color:var(--ink);font-size:14px;font-weight:700;";

      const titleLine = document.createElement("div");
      titleLine.textContent = primary.title;
      titleLine.style.cssText = "font-size:12px;color:var(--ink-soft);margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;";

      textWrap.appendChild(titleSpan);
      textWrap.appendChild(titleLine);

      // WHY 버튼 2개(한국/Global)를 다시 1개로 합쳤는지(2026-08-04, "글로벌도
      // 합치자 한 페이지에 같이 있고... 어차피 내가 올려야하니까 같이
      // 관리해야하기도 하고"): ko 대시보드와 언어별 global.html이 서로 다른
      // URL·다른 폼이라 관리자가 두 곳을 오가야 했다 — 이제 언어(ko 포함)가
      // 있는 topic은 전부 `lib/dashboard.py`의 `_generate_unified_dashboard`가
      // 만드는 output/<baseTopic>/dashboard.html 하나로 모인다(그 페이지
      // 안에서 언어 탭으로 전환, 각 탭은 기존 언어별 dashboard.html을 그대로
      // iframe으로 보여줘서 폼이 완전히 동일함). 언어가 애초에 하나뿐인(중첩
      // 폴더가 없는) 기존 topic은 그 자체가 이미 output/<topic>/dashboard.html
      // 이라 URL이 똑같이 유지된다 — 버튼 로직이 "중첩이냐 아니냐"만 분기하면
      // 끝나는 이유.
      // WHY 버튼 라벨에 "YT ✓"를 언어별로 표시하는지(2026-08-03 최초 도입 이유
      // 그대로 유지): topic 전체 완료(행 왼쪽 ✅/⬜, completed_topics.json)와
      // "이 언어의 유튜브 쇼츠만 업로드됐는지"(youtube_uploaded.json)는 서로
      // 다른 트래킹이라 섞으면 안 된다 — 버튼 하나로 합쳐도 이 구분은 그대로
      // "KO✓ EN JA" 식 언어별 배지로 유지한다.
      const isNested = variants.some(v => v.langSeg);
      const koVariant = variants.find(v => v.langSeg === "ko" || v.langSeg === null);
      const dashUrlBase = isNested
        ? `output/${encodeURIComponent(baseTopic)}/dashboard.html`
        : (koVariant ? koVariant.url : variants[0].url);
      // WHY ?tab= 안 붙이는지(2026-08-09, 목록 탭 제거와 같은 이유): 예전엔
      // index.html에서 누른 탭을 대시보드 페이지에 강제로 전달했는데, 이제
      // 목록에 탭 자체가 없다 — 대시보드 페이지 자체의 tab 버튼(트랙이 둘 다
      // 있을 때만 보임)이 그 역할을 대신한다.
      const dashUrl = dashUrlBase;

      const langBadges = variants
        .slice()
        .sort((a, b) => {
          const ak = (a.langSeg === "ko" || a.langSeg === null) ? "" : a.langSeg;
          const bk = (b.langSeg === "ko" || b.langSeg === null) ? "" : b.langSeg;
          return ak.localeCompare(bk);
        })
        .map(v => {
          const code = (v.langSeg === "ko" || v.langSeg === null) ? "KO" : v.langSeg.toUpperCase();
          const d = youtubeDone.has(v.topic) || (code === "KO" && youtubeDone.has(baseTopic));
          return code + (d ? "✓" : "");
        })
        .join(" ");

      const buttonWrap = document.createElement("div");
      buttonWrap.style.cssText = "display:flex;gap:8px;flex:0 0 auto;";

      const dashBtn = document.createElement("a");
      dashBtn.textContent = langBadges;
      dashBtn.href = dashUrl;
      dashBtn.setAttribute("aria-label", baseTopic + " 대시보드 열기 — 언어별 유튜브 쇼츠 업로드 상태: "
        + langBadges + "(✓ 표시는 유튜브 쇼츠 업로드만 뜻함, 다른 플랫폼 포스팅과는 별개)");
      dashBtn.style.cssText = "font-size:14px;font-weight:700;padding:10px 18px;border-radius:22px;text-decoration:none;white-space:nowrap;background:var(--accent);color:#fff;";

      buttonWrap.appendChild(dashBtn);

      if (done) {
        row.style.opacity = "0.45";
        row.style.background = "var(--bg-bottom)";
        titleSpan.style.textDecoration = "line-through";
      }

      row.appendChild(badge);
      row.appendChild(adTagBadge);
      row.appendChild(thumb);
      row.appendChild(textWrap);
      row.appendChild(buttonWrap);
      return row;
      }

      // WHY topic당 행 하나만: 목록에 트랙 구분이 없어졌으니(위 배지 WHY 참고)
      // 완료면 doneList, 아니면 topicsList 하나에만 넣는다. 완료 목록은
      // topics.updated_at이 아니라 completedAt(실제 완료 체크 시각) 기준으로
      // 따로 정렬해야 해서(2026-08-13, 위 completedAt WHY 참고) 바로 넣지
      // 않고 doneRowsPending에 모아뒀다가 루프 끝나고 한 번에 정렬해서 넣는다.
      const row = buildRow();
      if (done) {
        doneRowsPending.push({ row, baseTopic });
      } else {
        topicsList.appendChild(row);
      }
      rows.push({ row, topic: baseTopic, list: done ? doneList : topicsList });
    });
    // WHY completedAt 없는 항목은 맨 뒤로: 데이터가 없으면(예: 아주 옛날에
    // completed_topics만 있고 completed_at이 비어있는 레거시 행) 최신순 정렬
    // 의미가 없으니 안전하게 뒤로 보낸다.
    doneRowsPending
      .sort((a, b) => {
        const ta = completedAt.get(a.baseTopic) || "";
        const tb = completedAt.get(b.baseTopic) || "";
        return ta < tb ? 1 : ta > tb ? -1 : 0;
      })
      .forEach(({ row }) => doneList.appendChild(row));
    refreshDoneWrap();
    currentRows = rows;
    } // end renderAll

    renderAll();
    document.getElementById("topicsSection").style.display = "block";

    // WHY currentRows/getElementById를 매번 다시 참조하는지(2026-08-08, 완료
    // 배지 토글 도입): renderAll()이 배지 클릭마다 목록 DOM을 통째로 새로
    // 그리므로, 이 리스너가 만들어질 때 한 번 캡처한 옛 노드를 계속 붙잡고
    // 있으면 재검색 시 빈 화면을 가리키게 된다.
    searchInput.addEventListener("input", () => {
      const q = searchInput.value.trim().toLowerCase();
      const topicsListEl = document.getElementById("topicsList");
      const topicsEmptyEl = document.getElementById("topicsEmpty");
      let visibleCount = 0;
      currentRows.forEach(({ row, topic, list }) => {
        const match = topic.toLowerCase().includes(q);
        row.style.display = match ? "flex" : "none";
        if (match && row.parentElement === list && list === topicsListEl) visibleCount++;
      });
      topicsEmptyEl.style.display = visibleCount === 0 ? "block" : "none";
    });
  })
  .catch(() => {});

// WHY 위 topics 목록과 별개 Promise 체인인지: all_products.json은 topics.json과
// 갱신 시점이 같지만(dashboard.py가 매번 함께 씀) 실패해도 위 topic 목록
// 렌더링에 영향을 주면 안 된다 — 이 섹션은 실패해도 그냥 숨겨진 채로 둔다.
Promise.all([
  fetch("output/all_products.json").then(r => r.ok ? r.json() : []).catch(() => []),
  sb.from("global_product_links").select("market,product,url").then(r => r.data || []),
])
  .then(([products, linkRows]) => {
    if (!products.length) return;
    const have = new Set(linkRows.map(r => r.market + "|" + r.product));
    const missing = products.filter(p => !have.has("coupang|" + p) || !have.has("naver|" + p));
    const dock = document.getElementById("missingLinksDock");
    const toggle = document.getElementById("missingLinksToggle");
    const panel = document.getElementById("missingLinksPanel");
    const list = document.getElementById("missingLinksList");
    const countEl = document.getElementById("missingLinksCount");
    if (!missing.length) return;
    countEl.textContent = missing.length;
    dock.style.display = "block";
    toggle.addEventListener("click", () => panel.classList.toggle("open"));

    // WHY 검색/복사 버튼 추가(2026-08-09, "항목별로 링크 넣는거 왜 아예
    // 없애버렸어... 복사 버튼이랑 링크 넘어가는 버튼도 왜 다 빼먹은거야" —
    // 개별 topic 대시보드의 .dock-product-row(lib/dashboard.py _dock_products)
    // 패턴과 똑같이 맞춘다): 검색 링크 없이 입력창만 있으면 파트너스 링크를
    // 만들 상품 검색 페이지 자체를 못 열어서 애초에 붙여넣을 링크를 구할
    // 방법이 없다 — 쿠팡/네이버 검색 열기 버튼과 그 링크 복사 버튼을 그대로
    // 재현한다. 네이버 브랜드커넥트 ID는 data/affiliate_accounts.json과 동일
    // 값(계정 고정, topic마다 다르지 않음).
    const NAVER_BRANDCONNECT_ID = "978391003266240";
    // WHY Enter 키로만 저장(기존 topic별 상품 링크 입력창과 동일 UX 패턴
    // 재사용 — product-link-input): 타이핑 중간에 매 keystroke마다 upsert를
    // 보내면 낭비이고, blur만 쓰면 실수로 다른 곳 클릭했을 때 저장 안 됐는지
    // 헷갈린다 — Enter로 명시적 확정만 저장.
    // WHY document.createElement로 직접 만드는지(2026-08-11 버그 수정,
    // "밑에보면 목록에 아무것도 없잖음"): 이 블록이 el() 헬퍼(원래 카드뉴스
    // 미리보기 폼 쪽에서 정의됐던 함수)를 갖다 썼는데, 그 폼이 다른 세션의
    // 리팩터로 없어지면서 el() 정의 자체가 파일에서 사라졌다 — 배지·카운트는
    // 이 루프 진입 전에 이미 실행돼서 멀쩡해 보였지만, 루프 첫 줄에서
    // ReferenceError가 터져 목록은 항상 비어 있었다. 외부 함수 의존 없이
    // 그 자리에서 바로 만든다.
    missing.forEach(product => {
      const row = document.createElement("div");
      row.className = "missing-link-row";
      const title = document.createElement("b");
      title.textContent = product;
      row.appendChild(title);
      ["coupang", "naver"].forEach(market => {
        if (have.has(market + "|" + product)) return;
        const searchUrl = market === "coupang"
          ? `https://www.coupang.com/np/search?component=&q=${encodeURIComponent(product)}&channel=user`
          : `https://brandconnect.naver.com/${NAVER_BRANDCONNECT_ID}/affiliate/products/search?query=${encodeURIComponent(product)}&tab=product`;

        const searchRow = document.createElement("div");
        searchRow.className = "missing-link-search-row";
        const searchLink = document.createElement("a");
        searchLink.href = searchUrl;
        searchLink.target = "_blank";
        searchLink.rel = "noopener";
        searchLink.textContent = market === "coupang" ? "🛒 쿠팡 검색" : "🟢 네이버 검색";
        const copyBtn = document.createElement("button");
        copyBtn.type = "button";
        copyBtn.className = "missing-link-copy-btn";
        copyBtn.textContent = "🔎 복사";
        copyBtn.title = "검색 링크 복사 — 파트너스 링크 생성기에 붙여넣기용";
        copyBtn.addEventListener("click", () => {
          navigator.clipboard.writeText(searchUrl).then(() => {
            const orig = copyBtn.textContent;
            copyBtn.textContent = "복사됨 ✓";
            setTimeout(() => { copyBtn.textContent = orig; }, 1500);
          });
        });
        searchRow.appendChild(searchLink);
        searchRow.appendChild(copyBtn);

        const field = document.createElement("div");
        field.className = "missing-link-field";
        const label = document.createElement("label");
        label.textContent = market === "coupang" ? "쿠팡" : "네이버";
        const input = document.createElement("input");
        input.type = "text";
        input.className = "missing-link-input";
        input.placeholder = market === "coupang" ? "쿠팡 파트너스 링크 붙여넣기" : "네이버 커넥트 링크 붙여넣기";
        const saved = document.createElement("span");
        saved.className = "missing-link-saved";
        // WHY 마켓별 도메인 검증(2026-08-09, "유효성 검사도 넣을수있냐? 링크를
        // 잘못넣는경우 안되게하는거야" — 예: 네이버 칸에 쿠팡 링크를 잘못
        // 붙여넣는 실수 방지): URL 형식 자체가 아니라도, 쿠팡 파트너스 링크는
        // link.coupang.com/www.coupang.com, 네이버 커넥트는 naver.me/
        // brandconnect.naver.com 도메인만 실제로 유효하다 — 다른 도메인이면
        // 링크가 있어도 DB에 저장하지 않고 에러만 표시한다.
        const MARKET_HOST_PATTERNS = {
          coupang: /^https:\/\/(link\.coupang\.com|www\.coupang\.com)\//,
          naver: /^https:\/\/(naver\.me|brandconnect\.naver\.com)\//,
        };
        // WHY Enter 대신 input 이벤트인지(2026-08-09, "적용 이딴 버튼이 없는데
        // 바로바로 적용이되어야하는거아니야?" — Enter를 안 누르면 저장이 안
        // 됐음): 개별 topic 대시보드의 .product-link-input(lib/dashboard.py)이
        // 원래 input 이벤트(타이핑·붙여넣기 즉시)로 저장하는데, 이 위젯만
        // Enter 요구로 다르게 만들어서 붙여넣고 그냥 다른 데를 클릭하면
        // 저장 안 된 것처럼 보였다 — 같은 패턴으로 통일.
        input.addEventListener("input", async () => {
          const url = input.value.trim();
          saved.textContent = "";
          input.classList.remove("invalid");
          if (!url) return;
          if (!MARKET_HOST_PATTERNS[market].test(url)) {
            input.classList.add("invalid");
            saved.className = "missing-link-error";
            saved.textContent = market === "coupang"
              ? "⚠️ 쿠팡 파트너스 링크(link.coupang.com)가 아니에요"
              : "⚠️ 네이버 커넥트 링크(naver.me)가 아니에요";
            return;
          }
          saved.className = "missing-link-saved";
          await hsWrite("/api/global-product-links", "POST", { market, product, url });
          have.add(market + "|" + product);
          saved.textContent = "저장됨 ✓";
        });
        field.appendChild(label);
        field.appendChild(input);
        field.appendChild(saved);
        row.appendChild(searchRow);
        row.appendChild(field);
      });
      list.appendChild(row);
    });
  })
  .catch(() => {});

</script>

</body>
</html>
