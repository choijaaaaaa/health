00 · 표지


자다가 소변 때문에 두 번 이상 깨는 날이 잦다면, 단순히 나이 탓이나 전립선 때문만은 아닐 수 있어요. 야간뇨는 저녁에 마시는 음료, 다리 부종, 수면무호흡처럼 생각보다 다양한 원인으로 생기는 증상이라 원인부터 정확히 짚어볼 필요가 있어요.

01 · 이런 증상 겪어본 적 있나요


잠들었다가 소변 때문에 두 번 이상 깬 적 있다면 단순한 방광 문제가 아니라 몸이 보내는 다른 신호일 수 있어요. 하룻밤에 한 번 정도는 큰 문제가 아니지만, 반복해서 두 번 이상 깨고 그때마다 다시 잠들기 어렵다면 야간뇨로 보고 원인을 확인해볼 만해요.

02 · 왜 이런 증상이 생길까요


야간뇨는 전립선이나 방광 문제만으로 생기지 않아요. 국제요실금학회 기준으로 밤에 만들어지는 소변량이 하루 전체 소변량의 일정 비율(젊은 성인은 20% 이상, 고령층은 33% 이상)을 넘으면 '야간다뇨'로 구분하는데, 이 경우엔 방광이 아니라 신장이 밤에도 소변을 계속 만들어내는 게 원인이에요. 원래는 밤에 항이뇨호르몬이 늘어나 소변 생성을 줄여주는데, 나이가 들수록 이 리듬이 약해지면서 밤에도 낮만큼 소변이 만들어져요.

03 · 저녁의 커피와 술


먼저 저녁에 마시는 커피 같은 카페인 음료와 술이에요. 둘 다 이뇨 작용을 하는 데다 방광을 자극해서 소변량을 늘려요. 카페인은 오후 3시 이후엔 피하고, 술을 마신다면 잠들기 3~4시간 전엔 끝내는 게 좋아요.

04 · 자주 붓는 다리


두 번째로는 다리가 자주 붓거나 오래 서 있는 습관이에요. 낮 동안 중력 때문에 다리에 고였던 물이 눕는 순간 다시 혈관으로 돌아가고, 신장은 이렇게 늘어난 혈액량만큼 소변을 더 만들어요. 오래 서서 일하거나 다리가 잘 붓는 편이라면 이 과정이 밤에 더 뚜렷하게 나타나요.

05 · 심한 코골이


마지막으로 심하게 코를 골거나 수면무호흡이 있는 경우예요. 자다가 숨이 잠깐씩 멎으면 흉강 내 압력이 바뀌면서 심장에서 이뇨 호르몬이 분비되고, 그만큼 소변량 자체가 늘어나요. 코골이가 심한 사람일수록 야간뇨를 함께 겪는 경우가 많다고 알려져 있어요.

06 · 그래도 방법은 있어요


자기 전 2~3시간은 물과 술, 카페인을 줄여보세요. 다리가 잘 붓는다면 자기 전에 다리를 잠깐 올려두는 것만으로도 도움이 되고, 코골이가 심하다면 수면 상태를 점검해보는 것도 방법이에요.

07 · 마무리


이런 습관들이 있다고 해서 당장 병이 있다는 뜻은 아니에요. 다만 야간뇨가 자주 반복된다면 저녁에 마시는 것들과 다리 상태, 코골이까지 함께 살펴보는 게 원인을 찾는 데 도움이 돼요. 생활습관을 바꿔도 나아지지 않는다면 병원에서 정확한 원인을 확인해보는 것도 좋은 방법이에요.

// 안 그려졌거나 이미지 크기로 레이아웃이 한 번 더 바뀌는 경우가 있어
// 300ms 뒤 한 번 더 재측정(리사이즈 옵저버 대신 단순 setTimeout으로 충분 —
// 이 페이지는 로드 후 사용자가 카드를 펼치는 등 레이아웃이 계속 바뀌는
// 인터랙션이 없다).
document.querySelectorAll("iframe.dash-frame").forEach(frame => {
  function resize() {
    try {
      const h = frame.contentDocument.body.scrollHeight;
      if (h > 0) frame.style.height = h + "px";
    } catch (err) { /* 다른 오리진이면 접근 불가 — min-height로 폴백 */ }
  }
  frame.addEventListener("load", () => { resize(); setTimeout(resize, 300); });
});
</script>
<script>
// WHY 이 페이지(다국어 topic 통합 허브)의 ?tab=도 ko iframe에 그대로
// 전달하는지(2026-08-07, 위 개별 topic dashboard.html과 같은 이유):
// index.html에서 "카드뉴스"/"숏츠" 탭을 눌러 들어왔으면, 이 허브 페이지 안의
// 한국어 iframe도 같은 트랙만 보여야 한다 — 빌드 시점엔 어느 탭에서 올지
// 알 수 없으므로(iframe src가 고정 문자열) 런타임에 현재 URL을 보고 붙인다.
(function () {
  const tabParam = new URLSearchParams(location.search).get("tab");
  if (!tabParam) return;
  const frame = document.querySelector("iframe.dash-frame");
  if (frame) frame.src += (frame.src.includes("?") ? "&" : "?") + "tab=" + tabParam;
  // WHY 글로벌 라이트카드도 같이 필터링하는지(2026-08-08, "쇼츠쪽이랑
  // 카드뉴스쪽이랑 글로벌 인스타 릴스는 둘다 들어가있잖아" 버그 리포트): 위
  // iframe.src 갱신은 ko dashboard.html(iframe 내부)에만 적용되고, 글로벌
  // 언어의 라이트카드(_light_platform_card)는 필터링이 없어서 ?tab=으로
  // 뭘 눌러 들어와도 항상 전체 플랫폼을 그대로 보여줬다 — 카드뉴스 탭인데
  // 글로벌의 "Instagram Reels"(영상, video 타입)가 그대로 섞여 나오는 게
  // 문제였다. ko iframe 쪽과 같은 원칙(video → 숏츠, cards/text →
  // 카드뉴스)으로 plat-card를 개별 필터링하고, 카드가 전부 숨어서 빈
  // 섹션이 된 .lang-section은 통째로 숨긴다(글로벌은 현재 전부
  // shorts-only라 card_news 탭에서는 "글로벌" 섹션 자체가 사라짐).
  const wantVideo = tabParam === "shorts";
  document.querySelectorAll(".plat-card[data-plat-type]").forEach(card => {
    const isVideo = card.dataset.platType === "video";
    card.style.display = (isVideo === wantVideo) ? "" : "none";
  });
  document.querySelectorAll(".lang-section").forEach(section => {
    const cards = section.querySelectorAll(".plat-card");
    if (cards.length === 0) return;
    const anyVisible = Array.from(cards).some(c => c.style.display !== "none");
    section.style.display = anyVisible ? "" : "none";
  });
})();
document.querySelectorAll(".btn-copy").forEach(btn => {
  btn.addEventListener("click", () => {
    const ta = document.getElementById(btn.dataset.target);
    navigator.clipboard.writeText(ta.value).then(() => {
      const orig = btn.textContent;
      btn.textContent = "복사됨 ✓";
      setTimeout(() => btn.textContent = orig, 1500);
    });
  });
});
document.querySelectorAll(".btn-go[data-copy-target]").forEach(btn => {
  btn.addEventListener("click", () => {
    const ta = document.getElementById(btn.dataset.copyTarget);
    navigator.clipboard.writeText(ta.value);
  });
});
// WHY 글로벌 카드에도 완료 체크를 다는지(2026-08-05, "인스타그램 릴스
// 글로벌꺼도 선택할 수 있게 해주고 그거 export할때도 확인가능하게"): ko
// dashboard.html(iframe 속, CARD_TEMPLATE)의 done-toggle과 정확히 같은
// hs_done_<topic>_<key> localStorage 키 스킴을 써서, index.html의 CSV
// 내보내기가 언어 상관없이 전부 픽업하게 한다.
const TOPIC_NAME = "\ube44\ub1e8\uae30_9";
const sb = window.supabase.createClient(window.HS_SUPABASE_URL, window.HS_SUPABASE_ANON_KEY);
// WHY 쓰기는 sb.from()이 아니라 이 헬퍼(서버 API 경유)를 쓰는지(2026-08-14):
// Supabase 프로젝트를 다른 프로젝트(vernhaven-blog 계열)와 공유하게 되면서
// 그쪽 퍼블릭 사이트 브라우저 번들에도 같은 anon key가 노출된다 — anon에
// "전체 허용" RLS를 계속 걸어두면 아무나 이 관리 테이블을 쓰고 지울 수
// 있는 구멍이 생긴다. 그래서 실제 쓰기는 service_role 키를 쓰는 /api/*
// 서버 함수로 옮겼다 — 인증은 이 fetch가 아니라 middleware.js의
// matcher("/(.*)")가 /api/*까지 포함해서 이미 Basic Auth로 막는다.
async function hsWrite(path, method, body) {
  const res = await fetch(path, {
    method,
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify(body),
  });
  if (!res.ok) throw new Error(path + " " + method + " 실패: " + await res.text());
}
const STORAGE_PREFIX = "hs_done_" + encodeURIComponent(TOPIC_NAME) + "_";
(async () => {
  const { data: dbPosted } = await sb.from("posting_log").select("platform").eq("topic", TOPIC_NAME);
  const dbPostedSet = new Set((dbPosted || []).map(r => r.platform));

  document.querySelectorAll(".plat-done-toggle").forEach(cb => {
    const storageKey = STORAGE_PREFIX + cb.dataset.key;
    const card = cb.closest(".plat-card");
    if (localStorage.getItem(storageKey) || dbPostedSet.has(cb.dataset.name)) {
      cb.checked = true;
      card.classList.add("is-done");
    }
    cb.addEventListener("change", () => {
      if (cb.checked) {
        const postedAt = new Date().toISOString();
        const record = { topic: TOPIC_NAME, platform: cb.dataset.name, postedAt };
        localStorage.setItem(storageKey, JSON.stringify(record));
        card.classList.add("is-done");
        hsWrite("/api/posting-log", "POST", { topic: TOPIC_NAME, platform: cb.dataset.name, posted_at: postedAt });
      } else {
        localStorage.removeItem(storageKey);
        card.classList.remove("is-done");
        hsWrite("/api/posting-log", "DELETE", { topic: TOPIC_NAME, platform: cb.dataset.name });
      }
    });
  });
})();
</script>
</body>
</html>
