<!doctype html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>이유 없이 얼음이 자꾸 씹고 싶고 계단만 올라도 숨차고 어지럽다면 주목! - 빈혈 부르는 의외의 음식 습관 — 업로드 대시보드</title>
<style>
  :root {
    --bg-top: #fdf9f5; --bg-bottom: #f6ede6;
    --ink: #2b231f; --ink-soft: #8b7c6e;
    --accent: #c84a62; --accent-deep: #a3344a; --accent-soft: #fadee3;
    --panel: #fffdfa; --rule: #e9ddd0;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; font-family: "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", -apple-system, sans-serif;
    background: linear-gradient(180deg, var(--bg-top), var(--bg-bottom));
    color: var(--ink);
  }
  header { padding: 32px 24px 8px; text-align: center; }
  header h1 { margin: 0 0 6px; font-size: 22px; }
  header p { margin: 0; color: var(--ink-soft); font-size: 13px; }
  .back { display: inline-block; margin: 18px 0 0 20px; color: var(--ink-soft); font-size: 13px; text-decoration: none; }
  /* WHY main이 row-wrap 플렉스인지(2026-08-05, "글로벌도 영상 쪽에 한국이랑
     병렬로 나열되게 해"): 한국어(iframe)와 글로벌(카드) 섹션을 위아래로 쌓지
     않고 나란히 두 칼럼으로 배치 — 좁은 화면에서는 flex-wrap으로 자연스럽게
     아래로 떨어진다. */
  main {
    max-width: 1400px; margin: 0 auto; padding: 16px 20px 40px;
    display: flex; flex-wrap: wrap; align-items: flex-start; gap: 24px;
  }
  .lang-section { display: flex; flex-direction: column; gap: 10px; flex: 1 1 420px; min-width: 320px; }
  .lang-heading {
    margin: 0; font-size: 13px; font-weight: 700; color: var(--ink-soft);
    text-transform: uppercase; letter-spacing: 0.04em;
  }
  /* WHY 고정 650px인지(2026-08-05, "릴스 각 언어별로 카드 왜 없어졌어?" —
     실제로는 안 없어졌고 아래 글로벌 섹션이 화면 밖으로 밀려서 안 보인 것):
     탭 전환 방식일 땐 iframe 하나만 보이는 화면을 꽉 채워야 해서 80vh를 썼는데,
     지금은 이 iframe이 페이지 안 여러 섹션 중 하나라 80vh(대부분 화면 높이)를
     그대로 차지하면 바로 아래 글로벌 카드들이 스크롤 한참 뒤에야 보인다 —
     내용이 다 보이는 적당한 고정 높이로 줄인다. */
  iframe.dash-frame { width: 100%; height: 650px; border: 0; border-radius: 16px; background: var(--panel); display: block; }
  .lang-body { display: flex; gap: 16px; flex-wrap: wrap; }
  .plat-card {
    flex: 1 1 280px; background: var(--panel); border: 1px solid var(--rule); border-radius: 12px;
    padding: 14px;
  }
  .plat-lang {
    display: block; font-size: 11px; font-weight: 700; color: var(--accent-deep);
    text-transform: uppercase; letter-spacing: 0.03em; margin-bottom: 2px;
  }
  .plat-card h3 { margin: 0 0 8px; font-size: 14px; }
  .plat-card textarea {
    width: 100%; min-height: 120px; border: 1px solid var(--rule); border-radius: 8px; padding: 8px;
    font-size: 12px; font-family: inherit; resize: vertical;
  }
  .plat-actions { display: flex; gap: 8px; margin-top: 8px; }
  .plat-actions button, .plat-actions a {
    font-size: 12px; font-weight: 700; padding: 6px 12px; border-radius: 20px; border: none;
    text-decoration: none; cursor: pointer;
  }
  .btn-copy { background: var(--accent-soft); color: var(--accent-deep); }
  .btn-go { background: var(--accent); color: #fff; }
  .empty { text-align: center; padding: 60px 20px; color: var(--ink-soft); }
</style>
</head>
<body>
<a class="back" href="../../index.html">← 목록으로</a>
<header>
  <h1>이유 없이 얼음이 자꾸 씹고 싶고 계단만 올라도 숨차고 어지럽다면 주목! - 빈혈 부르는 의외의 음식 습관</h1>
  <p>언어별로 캡션·영상을 확인·업로드하세요 — 한 언어씩 완료해도 그대로 나머지가 이어집니다</p>
</header>
<main>
<section class="lang-section"><h2 class="lang-heading">한국어</h2><iframe class="dash-frame" src="ko/dashboard.html"></iframe></section>
<section class="lang-section"><h2 class="lang-heading">글로벌</h2><div class="lang-body">
<div class="plat-card">
  <h3><span class="plat-lang">일본어 日本語</span>Instagram Reels</h3>
  <textarea id="g-cap-ja-1" spellcheck="false">鉄分をちゃんと摂ってるのに貧血気味…その原因、実は「体にいい習慣」かもしれません🍵

#貧血 #鉄分 #鉄分不足 #緑茶 #腸活 #健康情報</textarea>
  <div class="plat-actions">
    <button class="btn-copy" data-target="g-cap-ja-1">캡션 복사</button>
    <a class="btn-go" href="https://www.instagram.com/worthitshopping_ja" target="_blank" rel="noopener" data-copy-target="g-cap-ja-1">열기 →</a>
  </div>
</div>

<div class="plat-card">
  <h3><span class="plat-lang">포르투갈어 Português</span>Instagram Reels</h3>
  <textarea id="g-cap-pt-1" spellcheck="false">Subiu as escadas do trabalho e ficou sem fôlego, com a cabeça rodando, mesmo tendo dormido bem? 🩸

Pode ser anemia por ferro baixo — e às vezes o problema não é só quanto ferro você come, é como e quando come certas coisas. Chimarrão, suplemento de cálcio e até o feijão preto sem molho podem estar atrapalhando a absorção.

#anemia #ferro #anemiaferropriva #saude #dicasdesaude #bemestar</textarea>
  <div class="plat-actions">
    <button class="btn-copy" data-target="g-cap-pt-1">캡션 복사</button>
    <a class="btn-go" href="https://www.instagram.com/worthitshopping_pt" target="_blank" rel="noopener" data-copy-target="g-cap-pt-1">열기 →</a>
  </div>
</div>

<div class="plat-card">
  <h3><span class="plat-lang">포르투갈어 Português</span>Facebook</h3>
  <textarea id="g-cap-pt-3" spellcheck="false">Se você sobe as escadas do trabalho e fica sem fôlego, com a cabeça rodando, mesmo tendo dormido bem, vale desconfiar da anemia por ferro baixo.

#anemia #ferro #anemiaferropriva #saude #dicasdesaude</textarea>
  <div class="plat-actions">
    <button class="btn-copy" data-target="g-cap-pt-3">캡션 복사</button>
    <a class="btn-go" href="https://www.facebook.com/" target="_blank" rel="noopener" data-copy-target="g-cap-pt-3">열기 →</a>
  </div>
</div>
</div></section>

</main>
<script>
document.querySelectorAll(".btn-copy").forEach(btn => {
  btn.addEventListener("click", () => {
    const ta = document.getElementById(btn.dataset.target);
    navigator.clipboard.writeText(ta.value).then(() => {
      const orig = btn.textContent;
      btn.textContent = "복사됨 ✓";
      setTimeout(() => btn.textContent = orig, 1500);
    });
  });
});
document.querySelectorAll(".btn-go[data-copy-target]").forEach(btn => {
  btn.addEventListener("click", () => {
    const ta = document.getElementById(btn.dataset.copyTarget);
    navigator.clipboard.writeText(ta.value);
  });
});
</script>
</body>
</html>
