00 · 표지


흰쌀밥이나 빵, 단 음료처럼 정제 탄수화물 위주로 먹으면 식후 혈당이 급격히 올랐다 떨어지길 반복하는 '혈당 스파이크'가 생겨요. 식이섬유가 부족하면 흡수 속도를 늦춰줄 완충장치가 없는 셈이라, 이게 쌓이면 인슐린 저항성으로 이어질 수 있어요.

01 · 왜 이런 문제가 생길까요


이럴 때 챙기면 좋은 게 블루베리예요. 2021년 영양학(Nutrients)지에 실린 연구에 따르면, 6일 동안 하루 150g의 블루베리를 섭취한 참가자는 그렇지 않은 사람보다 식후 혈당 스파이크가 낮았어요. 인슐린 저항성이 있는 비만 참가자 32명이 매일 블루베리 스무디 2잔을 마신 실험에서도 인슐린 감수성이 크게 개선된 것으로 나타났고요. 블루베리 특유의 짙은 보라색을 만드는 안토시아닌이라는 성분이 이런 변화와 관련 있는 것으로 보고 있어요.

02 · 혈당 관리와의 관계


혈관 건강에도 도움이 될 수 있어요. 오클라호마 주립대 연구팀이 대사증후군을 앓는 참가자들에게 8주 동안 매일 블루베리 350g을 갈아 마시게 한 결과, 혈압이 4~6% 낮아지고 나쁜 콜레스테롤(LDL)과 지질 산화 파생물 수치까지 함께 줄어든 것으로 나타났어요.

03 · 혈관 건강에도


재밌는 사실 하나, 냉동 블루베리가 생블루베리보다 안토시아닌이 더 많을 수 있어요. 얼리는 과정에서 세포벽이 깨지면서 안토시아닌이 늘고 흡수율도 높아지는 것으로 알려져 있거든요. 다만 식이섬유나 비타민K처럼 냉동 중 줄어드는 성분도 있으니 생과일과 번갈아 챙기는 것도 방법이에요.

04 · 냉동하면 오히려 좋아요


한 번에 4분의 3컵에서 한 컵 이내의 생블루베리 또는 무가당 냉동 블루베리가 적당해요. 단백질과 지방이 함께 있는 무가당 요거트나 견과류와 곁들이면 혈당 변화를 더 완만하게 만드는 데 도움될 수 있어요.

05 · 이렇게 드세요


말린 블루베리나 설탕이 첨가된 제품은 당류가 높아서 오히려 역효과가 날 수 있으니 피하는 게 좋아요. 당뇨병 환자라면 블루베리를 치료제처럼 여기지 말고, 의료진 지도 아래 식단에 포함시키는 게 안전해요.

06 · 주의할 점


블루베리 하나로 혈당이나 혈관 건강이 완전히 좋아지는 건 아니에요. 규칙적인 운동과 균형 잡힌 식사, 꾸준한 습관이 훨씬 중요하다는 걸 잊지 마세요.

07 · 마무리

<script>
document.querySelectorAll(".btn-copy").forEach(btn => {
  btn.addEventListener("click", () => {
    const ta = document.getElementById(btn.dataset.target);
    navigator.clipboard.writeText(ta.value).then(() => {
      const orig = btn.textContent;
      btn.textContent = "복사됨 ✓";
      setTimeout(() => btn.textContent = orig, 1500);
    });
  });
});
document.querySelectorAll(".btn-go[data-copy-target]").forEach(btn => {
  btn.addEventListener("click", () => {
    const ta = document.getElementById(btn.dataset.copyTarget);
    navigator.clipboard.writeText(ta.value);
  });
});
// WHY 글로벌 카드에도 완료 체크를 다는지(2026-08-05, "인스타그램 릴스
// 글로벌꺼도 선택할 수 있게 해주고 그거 export할때도 확인가능하게"): ko
// dashboard.html(iframe 속, CARD_TEMPLATE)의 done-toggle과 정확히 같은
// hs_done_<topic>_<key> localStorage 키 스킴을 써서, index.html의 CSV
// 내보내기가 언어 상관없이 전부 픽업하게 한다.
const TOPIC_NAME = "\ud608\ub2f9_2";
const STORAGE_PREFIX = "hs_done_" + encodeURIComponent(TOPIC_NAME) + "_";
document.querySelectorAll(".plat-done-toggle").forEach(cb => {
  const storageKey = STORAGE_PREFIX + cb.dataset.key;
  const card = cb.closest(".plat-card");
  if (localStorage.getItem(storageKey)) {
    cb.checked = true;
    card.classList.add("is-done");
  }
  cb.addEventListener("change", () => {
    if (cb.checked) {
      const record = { topic: TOPIC_NAME, platform: cb.dataset.name, postedAt: new Date().toISOString() };
      localStorage.setItem(storageKey, JSON.stringify(record));
      card.classList.add("is-done");
    } else {
      localStorage.removeItem(storageKey);
      card.classList.remove("is-done");
    }
  });
});
</script>
