<!doctype html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>심장이 갑자기 쿵쾅대고 뒷목이 뻐근하며 머리까지 지끈거리는 거, 사실 이 음식 때문일 수 있어요 - 혈압 확 올리는 의외의 음식들 — 업로드 대시보드</title>
<style>
  :root {
    --bg-top: #fdf9f5; --bg-bottom: #f6ede6;
    --ink: #2b231f; --ink-soft: #8b7c6e;
    --accent: #c84a62; --accent-deep: #a3344a; --accent-soft: #fadee3;
    --panel: #fffdfa; --rule: #e9ddd0;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; font-family: "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", -apple-system, sans-serif;
    background: linear-gradient(180deg, var(--bg-top), var(--bg-bottom));
    color: var(--ink);
  }
  header { padding: 32px 24px 8px; text-align: center; }
  header h1 { margin: 0 0 6px; font-size: 22px; }
  header p { margin: 0; color: var(--ink-soft); font-size: 13px; }
  .back { display: inline-block; margin: 18px 0 0 20px; color: var(--ink-soft); font-size: 13px; text-decoration: none; }
  main { max-width: 1040px; margin: 0 auto; padding: 16px 20px 40px; display: flex; flex-direction: column; gap: 28px; }
  .lang-section { display: flex; flex-direction: column; gap: 10px; }
  .lang-heading {
    margin: 0; font-size: 13px; font-weight: 700; color: var(--ink-soft);
    text-transform: uppercase; letter-spacing: 0.04em;
  }
  iframe.dash-frame { width: 100%; height: 80vh; min-height: 600px; border: 0; border-radius: 16px; background: var(--panel); display: block; }
  .lang-body { display: flex; gap: 16px; flex-wrap: wrap; }
  .plat-card {
    flex: 1 1 280px; background: var(--panel); border: 1px solid var(--rule); border-radius: 12px;
    padding: 14px;
  }
  .plat-lang {
    display: block; font-size: 11px; font-weight: 700; color: var(--accent-deep);
    text-transform: uppercase; letter-spacing: 0.03em; margin-bottom: 2px;
  }
  .plat-card h3 { margin: 0 0 8px; font-size: 14px; }
  .plat-card textarea {
    width: 100%; min-height: 120px; border: 1px solid var(--rule); border-radius: 8px; padding: 8px;
    font-size: 12px; font-family: inherit; resize: vertical;
  }
  .plat-actions { display: flex; gap: 8px; margin-top: 8px; }
  .plat-actions button, .plat-actions a {
    font-size: 12px; font-weight: 700; padding: 6px 12px; border-radius: 20px; border: none;
    text-decoration: none; cursor: pointer;
  }
  .btn-copy { background: var(--accent-soft); color: var(--accent-deep); }
  .btn-go { background: var(--accent); color: #fff; }
  .empty { text-align: center; padding: 60px 20px; color: var(--ink-soft); }
</style>
</head>
<body>
<a class="back" href="../../index.html">← 목록으로</a>
<header>
  <h1>심장이 갑자기 쿵쾅대고 뒷목이 뻐근하며 머리까지 지끈거리는 거, 사실 이 음식 때문일 수 있어요 - 혈압 확 올리는 의외의 음식들</h1>
  <p>언어별로 캡션·영상을 확인·업로드하세요 — 한 언어씩 완료해도 그대로 나머지가 이어집니다</p>
</header>
<main>
<section class="lang-section"><h2 class="lang-heading">한국어</h2><iframe class="dash-frame" src="ko/dashboard.html"></iframe></section>
<section class="lang-section"><h2 class="lang-heading">글로벌</h2><div class="lang-body">
<div class="plat-card">
  <h3><span class="plat-lang">영어 English</span>Instagram Reels</h3>
  <textarea id="g-cap-en-1" spellcheck="false">Two sugary drinks a day raised long-term blood pressure risk by 52%? 😳

Deli meat, drinks after work, and daily soda are three everyday habits quietly pushing your numbers up.

Here's why they do it, and what to swap them for instead.

🔗 Link in profile for more health tips!

#bloodpressure #highbloodpressure #hypertension #healthtips #hearthealth #wellness</textarea>
  <div class="plat-actions">
    <button class="btn-copy" data-target="g-cap-en-1">캡션 복사</button>
    <a class="btn-go" href="https://www.instagram.com/worthitshopping_en" target="_blank" rel="noopener" data-copy-target="g-cap-en-1">열기 →</a>
  </div>
</div>

<div class="plat-card">
  <h3><span class="plat-lang">일본어 日本語</span>Instagram Reels</h3>
  <textarea id="g-cap-ja-1" spellcheck="false">夕方になると指輪や靴がきつくなる…それ、塩分の摂りすぎのサインかもしれません🧂

梅干し・味噌汁・明太子やたらこ――それぞれに理由があります。

負担を減らすちょっとした工夫を動画でチェック！

もっと役立つ健康情報が気になる方はフォローしてお待ちください👆

#高血圧 #血圧 #塩分 #梅干し #健康情報</textarea>
  <div class="plat-actions">
    <button class="btn-copy" data-target="g-cap-ja-1">캡션 복사</button>
    <a class="btn-go" href="https://www.instagram.com/worthitshopping_ja" target="_blank" rel="noopener" data-copy-target="g-cap-ja-1">열기 →</a>
  </div>
</div>
</div></section>

</main>
<script>
document.querySelectorAll(".btn-copy").forEach(btn => {
  btn.addEventListener("click", () => {
    const ta = document.getElementById(btn.dataset.target);
    navigator.clipboard.writeText(ta.value).then(() => {
      const orig = btn.textContent;
      btn.textContent = "복사됨 ✓";
      setTimeout(() => btn.textContent = orig, 1500);
    });
  });
});
document.querySelectorAll(".btn-go[data-copy-target]").forEach(btn => {
  btn.addEventListener("click", () => {
    const ta = document.getElementById(btn.dataset.copyTarget);
    navigator.clipboard.writeText(ta.value);
  });
});
</script>
</body>
</html>
