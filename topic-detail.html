<!doctype html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>topic 상세</title>
<style>
  :root {
    --bg-top: #fdf9f5; --bg-bottom: #f6ede6; --ink: #2b231f; --ink-soft: #8b7c6e;
    --accent: #c84a62; --accent-deep: #a3344a; --accent-soft: #fadee3;
    --gold: #b27a26; --gold-soft: #f1e3c6; --panel: #fffdfa; --rule: #e9ddd0;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; font-family: "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", -apple-system, sans-serif;
    background: linear-gradient(180deg, var(--bg-top), var(--bg-bottom)); color: var(--ink); min-height: 100vh;
  }
  .wrap { max-width: 720px; margin: 0 auto; padding: 24px 20px 60px; }
  .back-link { font-size: 13px; color: var(--ink-soft); text-decoration: none; }
  .back-link:hover { color: var(--accent-deep); }
  h1 { font-size: 19px; margin: 14px 0 4px; line-height: 1.4; }
  .topic-name { font-size: 12px; color: var(--ink-soft); margin: 0 0 18px; }
  #status { text-align: center; color: var(--ink-soft); padding: 40px 0; }
  #status.error { color: var(--accent-deep); }

  .panel { background: var(--panel); border: 1px solid var(--rule); border-radius: 14px; padding: 16px; margin-bottom: 14px; }
  .panel h2 { font-size: 13px; margin: 0 0 10px; color: var(--ink-soft); }

  .image-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(120px, 1fr)); gap: 10px; }
  .image-item { display: flex; flex-direction: column; align-items: center; gap: 4px; }
  .image-item a { display: block; width: 100%; }
  .image-item img {
    width: 100%; aspect-ratio: 3/4; object-fit: cover; border-radius: 8px;
    border: 1px solid var(--rule); display: block; background: var(--rule);
  }
  .image-marker { font-size: 11px; color: var(--ink-soft); text-align: center; line-height: 1.3; }

  .caption-box {
    font-size: 13px; line-height: 1.6; white-space: pre-wrap; background: var(--bg-bottom);
    border-radius: 10px; padding: 12px; max-height: 340px; overflow-y: auto; margin: 0 0 10px;
  }

  .btn-row { display: flex; gap: 8px; flex-wrap: wrap; }
  .btn {
    border: none; border-radius: 999px; padding: 10px 18px; font-size: 13px; font-weight: 700;
    cursor: pointer; font-family: inherit; text-decoration: none; display: inline-flex; align-items: center; gap: 6px;
  }
  .btn-primary { background: var(--accent); color: #fff; }
  .btn-primary.copied { background: var(--gold); }
  .btn-ghost { background: var(--accent-soft); color: var(--accent-deep); }
  .btn-ghost.copied { background: var(--gold-soft); color: var(--gold); }

  .done-row { display: flex; align-items: center; gap: 8px; cursor: pointer; user-select: none; font-size: 14px; font-weight: 700; }
  .done-row input { width: 18px; height: 18px; accent-color: var(--accent); cursor: pointer; }

  .path-box {
    font-family: ui-monospace, SFMono-Regular, monospace; font-size: 12px; color: var(--ink-soft);
    background: var(--bg-bottom); border-radius: 8px; padding: 8px 10px; word-break: break-all; margin-bottom: 10px;
  }
  .path-hint { font-size: 11px; color: var(--ink-soft); margin: 8px 0 0; line-height: 1.5; }
</style>
</head>
<body>
<div class="wrap">
  <a class="back-link" href="javascript:history.length>1?history.back():window.close()">← 목록으로</a>
  <div id="status">불러오는 중…</div>
  <div id="content" style="display:none;">
    <h1 id="titleEl"></h1>
    <p class="topic-name" id="topicNameEl"></p>

    <div class="panel">
      <h2>완료 표시</h2>
      <label class="done-row">
        <input type="checkbox" id="doneCb">
        <span id="doneLabel">네이버 블로그 발행 완료</span>
      </label>
    </div>

    <div class="panel" id="imagesPanel">
      <h2>이미지 (번호 순서대로 삽입)</h2>
      <div class="image-grid" id="imageGrid"></div>
    </div>

    <div class="panel">
      <h2>캡션</h2>
      <p class="caption-box" id="captionBox"></p>
      <div class="btn-row">
        <button type="button" class="btn btn-primary" id="copyBtn">캡션 복사</button>
        <a class="btn btn-ghost" id="naverLinkBtn" href="#" target="_blank" rel="noopener">네이버 블로그로 이동(캡션 자동복사) ↗</a>
      </div>
    </div>

    <!-- WHY "폴더 경로 복사" 버튼(2026-08-16, "그 주제 폴더 경로로 바로
         이동시켜서 Finder 하나 열어주는거 구현 못하나"): 브라우저(특히
         https 페이지에서의 Chrome)는 보안상 웹페이지가 로컬 Finder를 직접
         띄우는 걸 막는다 — file:// 링크도 원격 페이지에서 클릭하면 대부분
         차단되거나 그냥 디렉터리 목록 탭이 뜨지, Finder가 열리지 않는다.
         대신 로컬 절대경로를 클립보드에 복사해두면 Finder에서
         Cmd+Shift+G(이동 → 폴더로 이동) 후 붙여넣기 한 번으로 바로 갈 수
         있다 — 클릭 한 번(복사)+단축키 한 번으로 사실상 동급의 경험. -->
    <div class="panel">
      <h2>로컬 폴더</h2>
      <div class="path-box" id="pathBox"></div>
      <div class="btn-row">
        <button type="button" class="btn btn-ghost" id="copyPathBtn">경로 복사</button>
      </div>
      <p class="path-hint">Finder를 웹페이지에서 직접 열 수는 없어요(브라우저 보안 제한) — 경로를 복사한 뒤 Finder에서 <b>Cmd+Shift+G</b>로 붙여넣으면 한 번에 이동돼요.</p>
    </div>
  </div>
</div>

<script>
// WHY sb(Supabase 클라이언트) 직접 안 쓰는지: 이 페이지는 posting_log
// 쓰기만 필요한데 그건 /api/posting-log 서버 함수(index.html의 hsWrite와
// 동일 헬퍼, 여기 그대로 복제)를 거친다 — sb.from() 직접 호출이 없어서
// supabase-js CDN 스크립트를 이 페이지엔 안 불러와도 된다.
async function hsWrite(path, method, body) {
  const res = await fetch(path, {
    method,
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify(body),
  });
  if (!res.ok) throw new Error(`${path} ${method} 실패: ${await res.text()}`);
}

(async function () {
  const params = new URLSearchParams(location.search);
  const verticalKey = params.get("vertical");
  const topic = params.get("topic");
  const statusEl = document.getElementById("status");

  if (!verticalKey || !topic) {
    statusEl.textContent = "잘못된 링크입니다(vertical/topic 파라미터 없음).";
    statusEl.classList.add("error");
    return;
  }

  let hub;
  try {
    const res = await fetch("output/card_news_hub.json");
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    hub = await res.json();
  } catch (err) {
    statusEl.textContent = "output/card_news_hub.json을 못 불러왔습니다.";
    statusEl.classList.add("error");
    return;
  }

  let item = null;
  outer:
  for (const group of hub.groups) {
    for (const vertical of group.verticals) {
      if (vertical.key !== verticalKey) continue;
      const found = vertical.items.find(i => i.topic === topic);
      if (found) { item = found; break outer; }
    }
  }

  if (!item) {
    statusEl.textContent = "해당 topic을 찾을 수 없습니다 — output/card_news_hub.json이 오래됐을 수 있어요(python3 -m lib.card_news_hub 재실행).";
    statusEl.classList.add("error");
    return;
  }

  statusEl.style.display = "none";
  document.getElementById("content").style.display = "block";
  document.title = item.title + " · topic 상세";
  document.getElementById("titleEl").textContent = item.title;
  document.getElementById("topicNameEl").textContent = topic;

  // 완료 체크 — index.html의 cnh-topic-row와 동일한 localStorage 키 +
  // Supabase posting_log 테이블을 그대로 공유한다.
  const storageKey = `hs_done_${item.topic}_naver_blog`;
  const doneCb = document.getElementById("doneCb");
  doneCb.checked = !!localStorage.getItem(storageKey);
  doneCb.addEventListener("change", () => {
    if (doneCb.checked) {
      const postedAt = new Date().toISOString();
      localStorage.setItem(storageKey, JSON.stringify({ topic: item.topic, platform: "네이버 블로그", postedAt }));
      hsWrite("/api/posting-log", "POST", { topic: item.topic, platform: "네이버 블로그", posted_at: postedAt });
    } else {
      localStorage.removeItem(storageKey);
      hsWrite("/api/posting-log", "DELETE", { topic: item.topic, platform: "네이버 블로그" });
    }
  });

  // 이미지 그리드
  const imageGrid = document.getElementById("imageGrid");
  if (item.images && item.images.length) {
    for (const img of item.images) {
      const cell = document.createElement("div");
      cell.className = "image-item";
      const link = document.createElement("a");
      link.href = img.url;
      link.target = "_blank";
      link.rel = "noopener";
      const thumb = document.createElement("img");
      thumb.src = img.url;
      thumb.alt = `${item.title} - ${img.marker}`;
      thumb.loading = "lazy";
      link.appendChild(thumb);
      cell.appendChild(link);
      const marker = document.createElement("span");
      marker.className = "image-marker";
      marker.textContent = img.marker;
      cell.appendChild(marker);
      imageGrid.appendChild(cell);
    }
  } else {
    document.getElementById("imagesPanel").style.display = "none";
  }

  // 캡션 + 복사
  // WHY 소제목 줄만 파란색 굵게 서식을 입혀서 복사하는지(2026-08-16, "블로그
  // 발행할 때 따로 작업 안 해도 되게 중요한 포인트를 색으로 차별화해달라"
  // 요청): 캡션 자체가 이미 "NN · 소제목" 마커로 각 항목의 핵심을 구분해
  // 놓은 구조라, 별도 판단 없이 이 줄만 강조하면 "중요 포인트"가 자연스럽게
  // 걸러진다. 일반 텍스트 클립보드(writeText)는 서식이 없어서, 대신
  // text/html도 함께 쓰는 clipboard.write()로 바꾼다 — 네이버 스마트에디터
  // 같은 contenteditable 기반 에디터는 붙여넣기 시 브라우저가 넘겨주는
  // text/html을 그대로 반영하는 게 일반적이지만(Word/타 웹페이지 붙여넣기와
  // 동일 경로), 실제로 이 에디터에서 색이 유지되는지는 아직 실사용 확인 전 —
  // 안 먹히면 이 서식 규칙(정규식)만 조정하면 됨. text/plain도 함께 넣어서
  // clipboard.write 자체가 막힌 구형 브라우저에서도 기존처럼 최소한 텍스트
  // 복사는 되게 한다(둘 다 실패하면 writeText로 최종 폴백).
  function escapeHtml(s) {
    return s.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
  }
  function captionToHtml(caption) {
    return escapeHtml(caption)
      .split("\n")
      .map(line => /^\d{2}\s*·\s*.+/.test(line)
        ? `<span style="color:#1a56db;font-weight:700">${line}</span>`
        : line)
      .join("<br>");
  }
  const captionHtml = captionToHtml(item.caption);
  document.getElementById("captionBox").innerHTML = captionHtml;
  const copyBtn = document.getElementById("copyBtn");
  copyBtn.addEventListener("click", async () => {
    try {
      if (window.ClipboardItem) {
        await navigator.clipboard.write([
          new ClipboardItem({
            "text/plain": new Blob([item.caption], { type: "text/plain" }),
            "text/html": new Blob([captionHtml], { type: "text/html" }),
          }),
        ]);
      } else {
        await navigator.clipboard.writeText(item.caption);
      }
      copyBtn.textContent = "복사됨";
      copyBtn.classList.add("copied");
      setTimeout(() => { copyBtn.textContent = "캡션 복사"; copyBtn.classList.remove("copied"); }, 1500);
    } catch (err) {
      try {
        await navigator.clipboard.writeText(item.caption);
        copyBtn.textContent = "복사됨(서식 없이)";
      } catch (err2) {
        copyBtn.textContent = "복사 실패";
      }
      setTimeout(() => { copyBtn.textContent = "캡션 복사"; copyBtn.classList.remove("copied"); }, 1500);
    }
  });

  // WHY 이 버튼(2026-08-16, "왜 링크로 바로 넘어가는 열기 버튼은 없지"
  // 실측 지적): 캡션만 복사해두고 실제로 어디에 붙여넣을지는 매번 따로
  // 찾아가야 했다 — platform_captions.json의 네이버 계정 url을
  // lib/card_news_hub.py가 이제 naver_url로 같이 넘겨준다. 계정 URL이
  // 아직 안 채워진 topic(빈 문자열)은 버튼 자체를 숨긴다(예: sparelow는
  // 계정이 아직 생성 전이라 URL이 있어도 실제로 안 열림 — 하지만 그건
  // 계정 자체 문제라 이 페이지가 판단할 일은 아니고, url이 아예 없는
  // 경우만 숨긴다).
  const naverLinkBtn = document.getElementById("naverLinkBtn");
  if (item.naver_url) {
    naverLinkBtn.href = item.naver_url;
  } else {
    naverLinkBtn.remove();
  }

  // 로컬 폴더 경로 복사
  document.getElementById("pathBox").textContent = item.local_path || "(경로 정보 없음)";
  const copyPathBtn = document.getElementById("copyPathBtn");
  if (!item.local_path) copyPathBtn.disabled = true;
  copyPathBtn.addEventListener("click", async () => {
    try {
      await navigator.clipboard.writeText(item.local_path);
      copyPathBtn.textContent = "복사됨";
      copyPathBtn.classList.add("copied");
      setTimeout(() => { copyPathBtn.textContent = "경로 복사"; copyPathBtn.classList.remove("copied"); }, 1500);
    } catch (err) {
      copyPathBtn.textContent = "복사 실패";
    }
  });
})();
</script>
</body>
</html>
